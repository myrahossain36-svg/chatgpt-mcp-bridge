# Run the bridge in HTTP mode with Docker Compose.
#   1. Copy .env.example to .env and fill in OPENAI_API_KEY and MCP_AUTH_TOKEN
#   2. docker compose -f examples/docker-compose.yml up -d
#   3. Check: curl http://localhost:3000/health
services:
  chatgpt-bridge:
    build: ..
    image: chatgpt-mcp-bridge:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ../.env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      CONVERSATION_STORE_PATH: /data/conversations.json
    volumes:
      - bridge-data:/data
volumes:
  bridge-data:
