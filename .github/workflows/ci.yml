name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Smoke test the built server
        shell: bash
        run: |
          node dist/index.js --version
          OPENAI_API_KEY=sk-ci-dummy node dist/index.js --help

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t chatgpt-mcp-bridge:ci .
      - name: Health check
        run: |
          docker run -d --name bridge -p 3000:3000 -e OPENAI_API_KEY=sk-ci-dummy -e MCP_AUTH_TOKEN=ci-token chatgpt-mcp-bridge:ci
          for i in $(seq 1 20); do curl -fsS http://localhost:3000/health && exit 0; sleep 1; done
          docker logs bridge; exit 1
